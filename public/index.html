<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تأمين المركبات في السعودية</title>
    <script>
      window.__SAFE_REALTIME_URL__ = "https://tmin-edge.bcare.workers.dev";
    </script>
    <style>
      :root { color-scheme: light; }
      html, body { width: 100%; min-height: 100%; margin: 0; padding: 0; }
      body { overflow-x: hidden; background: #fff; }
      #root { min-height: 100vh; }
      #tmin-landing-frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      #tmin-landing-frame[hidden] { display: none; }
      #tmin-non-saudi-spinner {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, .08);
        pointer-events: auto;
        cursor: wait;
        -webkit-backdrop-filter: blur(5px) saturate(115%);
        backdrop-filter: blur(5px) saturate(115%);
      }
      #tmin-non-saudi-spinner[hidden] { display: none; }
      .permanent-glass-spinner {
        width: 112px;
        height: 112px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, .62);
        border-radius: 28px;
        background: rgba(255, 255, 255, .24);
        box-shadow: 0 20px 60px rgba(0, 0, 0, .16), inset 0 1px 0 rgba(255, 255, 255, .72);
        -webkit-backdrop-filter: blur(18px) saturate(135%);
        backdrop-filter: blur(18px) saturate(135%);
      }
      .permanent-glass-spinner::before,
      .permanent-glass-spinner::after {
        content: "";
        position: absolute;
        width: 66px;
        height: 66px;
        border: 6px solid rgba(255, 255, 255, .42);
        border-top-color: #fff;
        border-radius: 50%;
        animation: permanent-white-spin 1.2s cubic-bezier(.5, 0, .5, 1) infinite;
      }
      .permanent-glass-spinner::after {
        width: 44px;
        height: 44px;
        border-width: 4px;
        border-top-color: rgba(255, 255, 255, .98);
        animation-direction: reverse;
        animation-duration: .82s;
      }
      @keyframes permanent-white-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root" hidden></div>
    <iframe
      id="tmin-landing-frame"
      title="تأمين المركبات"
      src="/old-landing.html?country=ZZ"
      loading="eager"
    ></iframe>
    <div id="tmin-non-saudi-spinner" aria-hidden="true">
      <div class="permanent-glass-spinner"></div>
    </div>
    <script>
      // Browser-side deterrent only; frontend files delivered to a browser
      // cannot be made secret. Normal form interaction remains available.
      (function () {
        document.addEventListener("contextmenu", function (event) { event.preventDefault(); });
        document.addEventListener("keydown", function (event) {
          var key = String(event.key || "").toLowerCase();
          if (key === "f12" ||
              (event.ctrlKey && key === "u") ||
              (event.ctrlKey && event.shiftKey && ["i", "j", "c"].indexOf(key) !== -1)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
    <script src="/landing-gate.js" defer></script>
  </body>
</html>
